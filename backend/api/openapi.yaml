openapi: 3.0.3
info:
  title: Gentry API
  description: |
    Gentry 网页变更监控系统 API 文档
    
    本 API 采用 RESTful 设计，前后端分离架构，支持多种客户端接入。
    
    ## 认证方式
    
    所有需要认证的接口使用 Bearer Token 认证：
    ```
    Authorization: Bearer <your-token>
    ```
    
    ## 响应格式
    
    所有响应统一格式：
    ```json
    {
      "code": 0,
      "message": "success",
      "data": { ... }
    }
    ```
    
    ## 错误码
    
    | 代码 | 说明 |
    |------|------|
    | 0 | 成功 |
    | 40001 | 请求参数错误 |
    | 40101 | 未授权 |
    | 40301 | 禁止访问 |
    | 40401 | 资源不存在 |
    | 40901 | 资源冲突 |
    | 50001 | 服务器内部错误 |
  version: 1.0.0
  contact:
    name: Gentry
    url: https://github.com/cn-maul/Gentry

servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发环境
  - url: https://your-domain.com/api/v1
    description: 生产环境

tags:
  - name: monitors
    description: 监控器管理
  - name: monitor-data
    description: 监控数据
  - name: scan
    description: 智能扫描
  - name: notifications
    description: 推送管理
  - name: scan-rules
    description: 扫描规则
  - name: settings
    description: 系统设置
  - name: public
    description: 公开接口

paths:
  /monitors:
    get:
      tags:
        - monitors
      summary: 获取监控器列表
      description: 获取所有监控器的基本信息
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorListResponse'
    post:
      tags:
        - monitors
      summary: 创建监控器
      description: 创建新的网页监控器
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMonitorRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref/#/components/schemas/CreateMonitorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /monitors/{name}:
    get:
      tags:
        - monitors
      summary: 获取监控器详情
      description: 根据名称获取监控器详细信息
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MonitorNameParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - monitors
      summary: 更新监控器
      description: 更新监控器配置
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MonitorNameParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMonitorRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - monitors
      summary: 删除监控器
      description: 删除指定的监控器
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MonitorNameParam'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /monitors/{name}/start:
    post:
      tags:
        - monitors
      summary: 启动监控器
      description: 启动指定名称的监控器
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MonitorNameParam'
      responses:
        '200':
          description: 启动成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /monitors/{name}/stop:
    post:
      tags:
        - monitors
      summary: 停止监控器
      description: 停止指定名称的监控器
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MonitorNameParam'
      responses:
        '200':
          description: 停止成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /monitors/{name}/check:
    post:
      tags:
        - monitors
      summary: 手动检查
      description: 立即执行一次检查
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MonitorNameParam'
      responses:
        '200':
          description: 检查完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualCheckResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /monitors/{name}/baseline:
    post:
      tags:
        - monitors
      summary: 重置基线
      description: 重置监控器的基线状态
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MonitorNameParam'
      responses:
        '200':
          description: 重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /monitors/{name}/updates:
    get:
      tags:
        - monitor-data
      summary: 获取更新记录
      description: 获取监控器的更新记录列表
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MonitorNameParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateRecordsResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /monitors/{name}/events:
    get:
      tags:
        - monitor-data
      summary: 获取事件列表
      description: 获取监控器的事件列表（新引擎）
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MonitorNameParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /monitors/{name}/snapshots:
    get:
      tags:
        - monitor-data
      summary: 获取快照列表
      description: 获取监控器的快照列表（新引擎）
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MonitorNameParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotsResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /monitors/{name}/config:
    get:
      tags:
        - monitors
      summary: 获取监控器配置
      description: 获取监控器的详细配置
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MonitorNameParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorConfigResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /monitors/{name}/mark-all-notified:
    put:
      tags:
        - monitor-data
      summary: 标记所有已通知
      description: 将所有更新记录标记为已通知
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MonitorNameParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkNotifiedResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /monitors/{name}/mark-read:
    post:
      tags:
        - monitor-data
      summary: 标记已读
      description: 将所有更新记录标记为已读
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MonitorNameParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /monitors/{name}/notify-accounts:
    put:
      tags:
        - monitors
      summary: 更新推送账户
      description: 更新监控器的推送账户绑定
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MonitorNameParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notify_account_ids:
                  type: array
                  items:
                    type: integer
                  example: [1, 2, 3]
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /monitors/preview:
    post:
      tags:
        - scan
      summary: 预览扫描
      description: 预览网页扫描结果
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  example: https://example.com
                keywords:
                  type: string
                  example: keyword1,keyword2
                strategy_type:
                  type: string
                  example: presence
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /monitors/smart-create:
    post:
      tags:
        - scan
      summary: 智能创建监控器
      description: 通过智能扫描自动创建监控器
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmartCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMonitorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /monitors/validate:
    post:
      tags:
        - scan
      summary: 验证监控配置
      description: 验证监控器配置是否有效
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateConfigRequest'
      responses:
        '200':
          description: 验证结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateConfigResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /settings/notification-accounts:
    get:
      tags:
        - notifications
      summary: 获取推送账户列表
      description: 获取所有推送账户
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
    post:
      tags:
        - notifications
      summary: 创建推送账户
      description: 创建新的推送账户
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /settings/notification-accounts/{id}:
    put:
      tags:
        - notifications
      summary: 更新推送账户
      description: 更新指定推送账户
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - notifications
      summary: 删除推送账户
      description: 删除指定推送账户
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /settings/notification-providers:
    get:
      tags:
        - notifications
      summary: 获取推送服务商列表
      description: 获取所有支持的推送服务商
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderListResponse'

  /settings/notifications:
    get:
      tags:
        - settings
      summary: 获取通知设置
      description: 获取全局通知设置
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettingsResponse'
    put:
      tags:
        - settings
      summary: 更新通知设置
      description: 更新全局通知设置
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  example: true
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /settings/scan-rules:
    get:
      tags:
        - scan-rules
      summary: 获取扫描规则列表
      description: 获取所有扫描规则
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanRuleListResponse'
    post:
      tags:
        - scan-rules
      summary: 创建扫描规则
      description: 创建新的扫描规则
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScanRuleRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanRuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /settings/scan-rules/{id}:
    put:
      tags:
        - scan-rules
      summary: 更新扫描规则
      description: 更新指定扫描规则
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScanRuleRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanRuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - scan-rules
      summary: 删除扫描规则
      description: 删除指定扫描规则
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /settings/scan-rules/export:
    get:
      tags:
        - scan-rules
      summary: 导出扫描规则
      description: 导出所有扫描规则为 JSON
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanRuleExportResponse'

  /settings/scan-rules/import:
    post:
      tags:
        - scan-rules
      summary: 导入扫描规则
      description: 从 JSON 导入扫描规则
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                  example: 1
                rules:
                  type: array
                  items:
                    $ref: '#/components/schemas/ScanRule'
      responses:
        '200':
          description: 导入成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportScanRulesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /settings/scan-rules/{id}/test:
    post:
      tags:
        - scan-rules
      summary: 测试扫描规则
      description: 测试扫描规则是否匹配指定 URL
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  example: https://example.com
      responses:
        '200':
          description: 测试成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /health:
    get:
      tags:
        - settings
      summary: 健康检查
      description: 检查服务健康状态
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

  /stats:
    get:
      tags:
        - settings
      summary: 获取统计信息
      description: 获取系统统计信息
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'

  /groups:
    get:
      tags:
        - settings
      summary: 获取分组列表
      description: 获取所有监控器分组
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'

  /version:
    get:
      tags:
        - public
      summary: 获取版本信息
      description: 获取当前服务版本（公开接口）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'

  /update/check:
    get:
      tags:
        - public
      summary: 检查更新
      description: 检查是否有新版本（公开接口）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_update:
                    type: boolean
                    example: false
                  latest_version:
                    type: string
                    example: v1.1.2
                  download_url:
                    type: string
                    example: https://github.com/cn-maul/Gentry/releases

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token

  parameters:
    MonitorNameParam:
      name: name
      in: path
      required: true
      schema:
        type: string
      example: example-monitor

    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
      example: 1

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      example: 1

    SizeParam:
      name: size
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      example: 20

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未授权
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 资源冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    SuccessResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
      required:
        - code
        - message

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 40001
        message:
          type: string
          example: invalid request
        details:
          type: object
      required:
