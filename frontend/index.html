<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c11" media="(prefers-color-scheme: dark)" />
    <title>Gentry - 网页变更监控</title>
    <script>
      // 在首帧绘制前同步应用已保存的主题，避免暗色用户进入时白屏闪烁
      try {
        if (localStorage.getItem('gentry_theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
