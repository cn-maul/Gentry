version: '3.8'

services:
  # Gentry 后端 API
  gentry-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gentry-backend
    ports:
      - "8080:8080"
    volumes:
      - gentry-data:/app/data
    environment:
      - PORT=8080
      - GIN_MODE=release
      - ALLOWED_ORIGINS=*
      - API_TOKEN=${API_TOKEN:-}
      - DB_PATH=/app/data/gentry.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Gentry 前端 Web UI
  gentry-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gentry-web
    ports:
      - "80:80"
    depends_on:
      - gentry-backend
    restart: unless-stopped

volumes:
  gentry-data:
