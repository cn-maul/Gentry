version: '3.8'

services:
  # Gentry 单服务：前端已嵌入二进制，API 与界面同端口
  gentry-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gentry-backend
    ports:
      - "8080:8080"
    volumes:
      - gentry-data:/app/data
    environment:
      - PORT=8080
      - GIN_MODE=release
      - ALLOWED_ORIGINS=*
      - API_TOKEN=${API_TOKEN:-}
      - DB_PATH=/app/data/gentry.db
      # 后端时区，默认北京时间；可按需改为 Asia/Shanghai 之外的其他时区
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  gentry-data:
